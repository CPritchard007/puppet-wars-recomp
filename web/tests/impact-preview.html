<!doctype html><html><head><style>body{margin:0;background:#30485c;color:white;font:20px sans-serif}main{display:flex}canvas{width:600px;height:500px}p{text-align:center}</style></head><body><main><section><canvas id="splat" width="600" height="500"></canvas><p>Original fish screen splat</p></section><section><canvas id="blast"></canvas><p>Original bomber explosion</p></section></main><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';import {EnemyEffects} from '/src/enemy-effects.js';import {drawFishSplat} from '/src/screen-effects.js';
const assets={};for(const kind of ['fishSplat','bomberBlast']){const data=await(await fetch(`/assets/enemies/${kind}-projectile.json`)).json();const map=await new THREE.TextureLoader().loadAsync('/'+data.material.texture);map.colorSpace=THREE.SRGBColorSpace;assets[kind]={data,map};}
const ctx=document.querySelector('#splat').getContext('2d');drawFishSplat(ctx,assets.fishSplat,{age:.25,rotation:.2},600,500);
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#blast'),alpha:true});renderer.setSize(600,500);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,1.2,.1,100);camera.position.set(0,1,10);const fx=new EnemyEffects(scene,assets);fx.update({enemies:[],projectiles:[],effects:[{id:1,kind:'bomberBlast',x:0,y:1,z:0,age:.2,radius:3}],floorY:0,time:.2});renderer.render(scene,camera);document.body.dataset.ready='true';
</script></body></html>
