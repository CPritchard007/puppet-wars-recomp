<!doctype html><html><head><base href="/"><meta charset="utf-8"><style>body{margin:0;background:#152030;color:white;font:20px sans-serif}#status{position:absolute;top:12px;left:12px}</style></head><body><div hidden><div id="diagnostics"></div><div id="error-list"></div><div id="error-count"></div><div id="show-errors"></div><div id="close-errors"></div><div id="copy-errors"></div><div id="download-errors"></div><div id="diagnostic-status"></div></div><div id="status">Loading actual town spawn…</div><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';import {loadWorld} from '/src/world.js';import {EnemyEffects} from '/src/enemy-effects.js';import {characterAnimation,characterFacing} from '/src/character-roster.js';import {Simulation} from '/src/simulation.js';
