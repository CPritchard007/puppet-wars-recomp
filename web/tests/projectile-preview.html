<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#182433;color:white;font:24px sans-serif}canvas{display:block}footer{display:flex;justify-content:space-around;padding:20px}</style></head><body><canvas></canvas><footer><span>Elf · Snowball</span><span>Gunner · Tomato</span><span>Clown · Flaming gift</span></footer><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';import {EnemyEffects} from '/src/enemy-effects.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:true});renderer.setSize(1200,420);renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-6,6,2.1,-2.1,.1,100);camera.position.z=10;const projectiles={};for(const kind of ['snowball','tomato','fireball']){const data=await(await fetch(`/assets/enemies/${kind}-projectile.json`)).json(),map=await new THREE.TextureLoader().loadAsync('/'+data.material.texture);map.colorSpace=THREE.SRGBColorSpace;projectiles[kind]={data,map};}const fx=new EnemyEffects(scene,projectiles),sim={enemies:[],effects:[],floorY:0,projectiles:['snowball','tomato','fireball'].map((kind,i)=>({id:i,kind,x:(i-1)*4,y:0,z:0,age:0}))};renderer.setAnimationLoop(t=>{sim.time=t/1000;sim.projectiles.forEach(p=>p.age=t/1000);fx.update(sim);renderer.render(scene,camera);});document.body.dataset.ready='true';
</script></body></html>
